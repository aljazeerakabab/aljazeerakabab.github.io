<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al Jazeera Kabab Restaurant</title>
<style>
:root{--bg:#fff8ee;--cd:#fff;--tx:#2a1a0c;--mu:#7a6650;--ac:#c8321e;--bd:#ead9bf}
@media(prefers-color-scheme:dark){:root{--bg:#1b1410;--cd:#2a201a;--tx:#f5e9d8;--mu:#b9a68c;--ac:#ef6a54;--bd:#4a3a2e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;max-width:680px;margin:auto;padding:0 12px 210px}
header{position:relative;text-align:center;padding:16px 12px 12px;background:#12203a;color:#fff;margin:0 -12px;border-radius:0 0 16px 16px}header a{color:#ffd27a}header .mu{color:#c9d3e6}header h1{color:#fff;padding-right:0;margin-top:26px}.pill{position:absolute;right:10px;top:10px;background:#f5a30f;color:#1b1410;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px}h1{margin:0;font-size:22px}h2{font-size:15px;color:var(--ac);margin:18px 0 6px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin:6px 0}
button,select,input,textarea{font:inherit;color:inherit}button{border:0;border-radius:8px;background:var(--ac);color:#fff;padding:8px 12px;cursor:pointer}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input,textarea,select{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;margin:3px 0}
.q{display:flex;align-items:center;gap:8px}.q button{padding:2px 11px;font-size:18px}.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:680px;margin:auto;background:var(--cd);border-top:1px solid var(--bd);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{padding:3px 9px;border-radius:99px;font-size:12px;background:var(--bd)}.off{opacity:.45}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:260px;margin:10px auto}.cell{aspect-ratio:1;font-size:34px;background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
.sl{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;margin:8px 0}.sc{aspect-ratio:1;background:var(--cd);border:1px solid var(--bd);font-size:9px;position:relative;line-height:1}
.sc i{position:absolute;right:1px;bottom:1px;font-style:normal;font-size:8px;color:var(--ac)}.sc u{text-decoration:none;position:absolute;left:1px;bottom:0;font-size:11px}
.l{background:#2e7d3226}.s{background:#c8321e26}footer{text-align:center;margin-top:24px}
.row .ph{width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}.ph img{width:100%;height:100%;object-fit:cover}.nm{flex:1}.pr{color:var(--ac);font-weight:700}.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin:6px 0}.chips button{white-space:nowrap;border-radius:99px;flex:none}.q button:not(.g){background:#0f7b6c}.btnl{display:inline-block;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}.th{width:44px;height:44px;border-radius:8px;object-fit:cover}
#ticket{display:none}@media print{@page{size:80mm auto;margin:2mm}body{max-width:none;padding:0!important;margin:0}body>*:not(#ticket){display:none!important}#ticket{display:block;font:14px/1.35 monospace;color:#000;background:#fff;width:100%}#ticket h3{margin:0;text-align:center}#ticket hr{border:0;border-top:1px dashed #000}.tl{display:flex;justify-content:space-between;gap:6px}}
.logo{width:104px;height:auto;border-radius:14px;border:2px solid #c8321e;margin-top:24px;box-shadow:0 4px 14px #0006}.ar{font-family:"Reem Kufi",serif;font-size:28px;color:#ffd27a;margin-top:8px;line-height:1.2}header h1.en{font-family:Oswald,Impact,sans-serif;font-weight:700;letter-spacing:2px;font-size:26px;margin:2px 0 8px;padding:0}header h1.en small{display:block;font-size:13px;font-weight:500;color:#ff8a75;letter-spacing:6px}
</style></head><body>

 V.innerHTML=`<div class="tabs">${["orders","menu","comments","qr"].map(k=>`<button class="${pane==k?"":"g"}" data-pane="${k}">${k=="qr"?"QR codes":k[0].toUpperCase()+k.slice(1)}</button>`).join("")}<button class="g" id="logout">Log out</button></div>`+(pane=="menu"?`<div class="row" style="display:block"><b>Add item</b><input id="mn" placeholder="Name"><input id="mp" type="number" placeholder="Price (QR)"><input id="mc" list="cl2" placeholder="Category"><datalist id="cl2">${[...new Set([...CATS,...menu.map(m=>m.cat)])].map(c=>`<option value="${esc(c)}">`).join("")}</datalist><button id="addm">Add</button> ${menu.length?"":`<button class="g" id="seed">Load starter menu</button>`}</div>`:"")+`<div id="ap2"></div>`;fillA()}

 if(pane=="orders"){if(!orders.length)h=`<p class="mu">No orders yet.</p>`;orders.forEach(o=>{h+=`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b style="font-size:18px">🪑 Table ${esc(o.table)} · ${new Date(o.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</b><span class="st">${STL[o.status]} · ${o.paid?"PAID":"UNPAID"}</span></div><div>👤 ${esc(o.name||"")} · <a href="tel:${esc(o.phone||"")}">${esc(o.phone||"")}</a></div><div>${o.items.map(i=>esc(i.n)+" ×"+i.q).join("<br>")}</div>${o.note?`<div class="mu">Note: ${esc(o.note)}</div>`:""}<div class="mu">Total ${o.total} QR${o.eta?" · "+o.eta+" min":""}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${o.status=="new"?[10,15,20,25].map(m=>`<button data-eta="${o.id}|${m}">${m} min</button>`).join(""):""}${o.status=="accepted"?`<button data-done="${o.id}">Ready ✔</button>`:""}${o.paid?"":`<button data-paid="${o.id}">Mark paid</button>`}<button class="g" data-print="${o.id}">🖨 Print</button><button class="g" data-delo="${o.id}">Delete</button></div></div>`})}
 if(pane=="menu")sortM(menu).forEach(m=>{h+=`<div class="row" style="display:block"><input data-f="name" data-id="${m.id}" value="${esc(m.name)}"><div style="display:flex;gap:6px"><input data-f="price" data-id="${m.id}" type="number" value="${m.price}"><input data-f="cat" data-id="${m.id}" value="${esc(m.cat)}"></div><div style="display:flex;gap:8px;align-items:center;margin:4px 0">${m.img?`<img class="th" src="${esc(m.img)}" alt="">`:""}<label class="btnl">📷 ${m.img?"Change":"Add"} photo<input type="file" accept="image/*" hidden data-photo="${m.id}"></label>${m.img?`<button class="g" data-rmimg="${m.id}">Remove</button>`:""}</div><label><input type="checkbox" style="width:auto" data-f="avail" data-id="${m.id}" ${m.avail===false?"":"checked"}> Available</label> <button class="g" data-delm="${m.id}">Delete</button></div>`});
 if(pane=="qr")h=[1,2,3,4,5,6,7,8].map(n=>{const u=location.origin+"/?t="+n,q=encodeURIComponent(u);return`<div class="row"><div><b>Table ${n}</b><div class="mu">${esc(u)}</div></div><a href="https://api.qrserver.com/v1/create-qr-code/?size=700x700&margin=20&data=${q}" target="_blank"><img style="width:90px;height:90px;background:#fff" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${q}" alt="QR"></a></div>`}).join("")+`<p class="mu">Tap a QR to open the large version, then save or print it.</p>`;
 if(pane=="comments")h=comments.map(c=>`<div class="row"><div><b>${esc(c.name)}</b><div>${esc(c.text)}</div></div><button class="g" data-delc="${c.id}">Delete</button></div>`).join("")||`<p class="mu">No comments.</p>`;
 e.innerHTML=h}
/* ===== events ===== */
document.addEventListener("click",async e=>{const t=e.target,d=t.dataset||{};try{
 if(d.tab){tab=d.tab;render()}else if(d.game){game=d.game;render()}
 else if(d.cat!==undefined){cat=d.cat;render()}else if(d.plus){const m=menu.find(x=>x.id==d.plus);cart[m.id]=cart[m.id]||{n:m.name,p:m.price,q:0};cart[m.id].q++;render()}
 else if(d.minus){if(--cart[d.minus].q<=0)delete cart[d.minus];render()}
 else if(t.id==="send"){if(!table)return alert("Please scan the QR code on your table to order");const nm=$("#nm").value.trim(),ph=$("#ph").value.trim();if(!nm||!/^[0-9+\s-]{7,20}$/.test(ph))return alert("Please enter your name and a valid phone number");localStorage.setItem("cust",JSON.stringify([nm,ph]));t.disabled=true;
  const r=await addDoc(collection(db,"orders"),{table:table,name:nm,phone:ph,paid:false,items:Object.values(cart),total:tot(),note:$("#nt").value.trim(),status:"new",eta:0,ts:Date.now()});myId=r.id;localStorage.setItem("myOrder",myId);cart={};tab="status";
  onSnapshot(doc(db,"orders",myId),s=>{myOrder=s.exists()?s.data():null;render()});render()}
 else if(t.id==="cs"){const n=$("#cn").value.trim(),x=$("#ct").value.trim();if(!n||!x)return;await addDoc(collection(db,"comments"),{name:n,text:x,ts:Date.now()});$("#ct").value=""}
 else if(t.id==="login"){await signInWithEmailAndPassword(auth,$("#ae").value,$("#ap").value)}
 else if(t.id==="logout")signOut(auth);
 else if(d.pane){pane=d.pane;admin()}
 else if(d.eta){const[i,m]=d.eta.split("|");await updateDoc(doc(db,"orders",i),{eta:+m,etaAt:Date.now()+(+m)*60000,status:"accepted"})}
 else if(d.done)await updateDoc(doc(db,"orders",d.done),{status:"done"});
 else if(d.print)printT(d.print);else if(d.paid)await updateDoc(doc(db,"orders",d.paid),{paid:true,paidAt:Date.now()});
 else if(d.delo&&confirm("Delete order?"))await deleteDoc(doc(db,"orders",d.delo));
 else if(d.rmimg)await updateDoc(doc(db,"menu",d.rmimg),{img:""});
 else if(d.delm&&confirm("Delete item?"))await deleteDoc(doc(db,"menu",d.delm));
 else if(d.delc&&confirm("Delete comment?"))await deleteDoc(doc(db,"comments",d.delc));
 else if(t.id==="addm"){const n=$("#mn").value.trim(),p=+$("#mp").value,c=$("#mc").value.trim();if(!n||!p||!c)return alert("Fill name, price and category");await addDoc(collection(db,"menu"),{name:n,price:p,cat:c,avail:true});["#mn","#mp","#mc"].forEach(s=>$(s).value="")}
 else if(t.id==="seed"){const b=writeBatch(db);SEED.forEach(([name,price,cat])=>b.set(doc(collection(db,"menu")),{name,price,cat,avail:true}));await b.commit()}
 else if(d.c!==undefined)tttMove(+d.c);else if(d.reset)tttReset();else if(t.id==="roll")roll();else if(t.id==="snkreset"){S={p:0,c:0,msg:"Roll the dice!",busy:false};render()}
}catch(x){err(x)}});
document.addEventListener("input",e=>{const i=e.target.id;if(i==="nm")nmv=e.target.value;if(i==="ph")phv=e.target.value;if(i==="nt")ntv=e.target.value});
document.addEventListener("change",async e=>{const d=e.target.dataset;if(d.photo){const f=e.target.files[0];if(!f)return;try{await updateDoc(doc(db,"menu",d.photo),{img:await shrink(f)})}catch(x){err(x)}return}if(!d.f)return;let v=e.target.type==="checkbox"?e.target.checked:e.target.value;if(d.f==="price")v=+v;try{await updateDoc(doc(db,"menu",d.id),{[d.f]:v})}catch(x){err(x)}});
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))};i.onerror=no;i.src=URL.createObjectURL(f)});
function cdT(o){if(o.status==="done")return"✅ Your order is ready!";if(!o.etaAt)return"Waiting for kitchen…";const t=Math.round((o.etaAt-Date.now())/1000);return t>0?"⏱ "+String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"):"Almost ready…"}
setInterval(()=>{const e=document.querySelector(".cd");if(e&&myOrder)e.textContent=cdT(myOrder)},1000);
function printT(id){const o=orders.find(x=>x.id===id);if(!o)return;const tm=new Date(o.ts).toLocaleString([],{dateStyle:"short",timeStyle:"short"});
 $("#ticket").innerHTML=`<h3>Al Jazeera Kabab</h3><h3 style="font-size:26px">TABLE ${esc(o.table)}</h3><div style="text-align:center">${esc(tm)}</div><hr><div>${esc(o.name||"")}</div><div>${esc(o.phone||"")}</div><hr>${o.items.map(i=>`<div class="tl"><span>${esc(i.q)} x ${esc(i.n)}</span><span>${i.q*i.p}</span></div>`).join("")}<hr>${o.note?`<div>NOTE: ${esc(o.note)}</div><hr>`:""}<div class="tl"><b>TOTAL</b><b>${esc(o.total)} QR</b></div><div style="text-align:center;margin-top:6px"><b>${o.paid?"PAID":"UNPAID"}</b></div>`;
 setTimeout(()=>window.print(),150)}
/* ===== Tic-Tac-Toe ===== */
let game="ttt",B=Array(9).fill(""),over=false,tmsg="You are ❌, computer is ⭕";const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],win=(b,p)=>L.some(l=>l.every(i=>b[i]==p));
const tttH=()=>`<p style="text-align:center">${tmsg}</p><div class="grid3">${B.map((v,i)=>`<button class="cell" data-c="${i}">${v}</button>`).join("")}</div><div style="text-align:center"><button data-reset="1">New game</button></div>`;
function tttReset(){B=Array(9).fill("");over=false;tmsg="You are ❌, computer is ⭕";render()}
function tttMove(i){if(over||B[i])return;B[i]="❌";if(win(B,"❌")){over=true;tmsg="🎉 You win!";return render()}let f=B.map((v,k)=>v?-1:k).filter(k=>k>=0);if(!f.length){over=true;tmsg="Draw!";return render()}
 const pk=p=>f.find(k=>{const t=[...B];t[k]=p;return win(t,p)});let k=pk("⭕");if(k===undefined)k=pk("❌");if(k===undefined)k=B[4]?f[Math.random()*f.length|0]:4;B[k]="⭕";
 if(win(B,"⭕")){over=true;tmsg="Computer wins 😄"}else if(!B.includes("")){over=true;tmsg="Draw!"}render()}
/* ===== Snakes & Ladders ===== */
const SN={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78},LD={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
let S={p:0,c:0,msg:"Roll the dice!",busy:false};
function snkH(){let g="";for(let r=9;r>=0;r--)for(let c=0;c<10;c++){const n=r*10+(r%2?10-c:c+1);g+=`<div class="sc ${LD[n]?"l":SN[n]?"s":""}">${n}${LD[n]?`<i>↑${LD[n]}</i>`:SN[n]?`<i>↓${SN[n]}</i>`:""}<u>${(S.p==n?"🔵":"")+(S.c==n?"🔴":"")}</u></div>`}
 return`<p style="text-align:center">${S.msg}<br><span class="mu">🔵 You: ${S.p} · 🔴 Computer: ${S.c}</span></p><div class="sl">${g}</div><div style="text-align:center"><button id="roll" ${S.busy?"disabled":""}>🎲 Roll</button> <button class="g" id="snkreset">New game</button></div>`}
function step(k){const d=Math.ceil(Math.random()*6);let n=S[k]+d;if(n>100)n=S[k];n=LD[n]||SN[n]||n;S[k]=n;return d}
function roll(){if(S.busy)return;S.busy=true;const d=step("p");S.msg=`You rolled ${d}`;if(S.p==100){S.msg="🎉 You win!";S.busy=false;return render()}render();
 setTimeout(()=>{const e=step("c");S.msg=`You rolled ${d}. Computer rolled ${e}.`;if(S.c==100)S.msg="Computer wins 😄";else S.busy=false;render()},800)}
</script></body></html>
